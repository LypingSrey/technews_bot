name: Tech News Bot

on:
  schedule:
    # Every 3 hours (times are UTC; Phnom Penh is UTC+7)
    - cron: "0 */3 * * *"
  workflow_dispatch: # lets you run it manually with the "Run workflow" button

permissions:
  contents: write # needed to save sent.json (so articles aren't repeated)

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Check news and send to Telegram
        run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Remember sent articles
        run: |
          git config user.name "tech-news-bot"
          git config user.email "tech-news-bot@users.noreply.github.com"
          git add sent.json
          git diff --staged --quiet || git commit -m "Update sent articles"
          git push
